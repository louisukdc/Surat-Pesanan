<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin — Surat Pesanan RKZ</title>
    <meta name="description" content="Portal admin IT Departemen Surat Pesanan RS RKZ Surabaya">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; background: #f8faff; }
        .bg-layer { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
        .bg-main { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 60% at 15% 20%, rgba(239,246,255,1) 0%, transparent 60%), radial-gradient(ellipse 60% 50% at 85% 80%, rgba(238,242,255,0.9) 0%, transparent 60%), linear-gradient(155deg, #e8f1ff 0%, #f8faff 50%, #eef2ff 100%); }
        .bg-mesh { position: absolute; inset: 0; background-image: linear-gradient(rgba(37,99,235,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(37,99,235,0.05) 1px, transparent 1px); background-size: 40px 40px; }
        .blob { position: absolute; border-radius: 50%; filter: blur(70px); animation: blobFloat 12s ease-in-out infinite alternate; }
        .blob-1 { width: 450px; height: 450px; background: rgba(219,234,254,0.7); top: -100px; left: -100px; }
        .blob-2 { width: 350px; height: 350px; background: rgba(224,231,255,0.6); bottom: -80px; right: -60px; animation-delay: -5s; }
        @keyframes blobFloat { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(25px, 35px) scale(1.07); } }
        .page-wrapper { position: relative; z-index: 10; width: 100%; max-width: 440px; padding: 1.5rem; animation: fadeUp 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(30px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .login-card { background: white; border-radius: 28px; box-shadow: 0 2px 8px rgba(37,99,235,0.04), 0 16px 40px rgba(37,99,235,0.09), 0 0 0 1px rgba(37,99,235,0.06); overflow: hidden; }
        .card-header-strip { height: 5px; background: linear-gradient(90deg, #1d4ed8, #4f46e5, #7c3aed); }
        .card-body { padding: 2.5rem 2.5rem 2rem; }
        .admin-badge { display: inline-flex; align-items: center; gap: 7px; background: #eff6ff; border: 1.5px solid #bfdbfe; border-radius: 50px; padding: 5px 14px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #1d4ed8; margin-bottom: 1.5rem; }
        .badge-dot { width: 6px; height: 6px; background: #2563eb; border-radius: 50%; animation: blinkDot 1.5s ease-in-out infinite; }
        @keyframes blinkDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.7); } }
        .logo-area { display: flex; align-items: center; gap: 14px; margin-bottom: 1.8rem; }
        .logo-box { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #dbeafe, #e0e7ff); border: 1.5px solid #bfdbfe; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(37,99,235,0.12); flex-shrink: 0; }
        .logo-box img { width: 36px; filter: drop-shadow(0 2px 4px rgba(37,99,235,0.2)); }
        .logo-text-wrap h2 { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.35rem; color: #0f172a; letter-spacing: -0.5px; }
        .logo-text-wrap p { font-size: 0.78rem; color: #64748b; font-weight: 500; }
        .form-group { margin-bottom: 1.1rem; }
        .form-label { display: block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #64748b; margin-bottom: 0.45rem; }
        .input-wrap { position: relative; }
        .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #cbd5e1; font-size: 1rem; transition: color 0.25s; pointer-events: none; }
        .form-input { width: 100%; background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 12px 14px 12px 40px; font-size: 0.91rem; font-family: 'Inter', sans-serif; color: #0f172a; transition: all 0.25s ease; outline: none; }
        .form-input::placeholder { color: #94a3b8; }
        .form-input:focus { background: white; border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59,130,246,0.1); }
        .input-wrap:focus-within .input-icon { color: #3b82f6; }
        .btn-login { width: 100%; padding: 13px; background: linear-gradient(135deg, #1d4ed8 0%, #4f46e5 100%); border: none; border-radius: 12px; color: white; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 0.92rem; letter-spacing: 0.5px; cursor: pointer; position: relative; overflow: hidden; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 8px 20px rgba(29,78,216,0.3); margin-top: 0.8rem; }
        .btn-login::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 60%); }
        .btn-login:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(29,78,216,0.4); }
        .btn-login:disabled { opacity: 0.65; cursor: not-allowed; }
        .btn-inner { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .divider-line { display: flex; align-items: center; gap: 10px; margin: 1.3rem 0 1rem; font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #cbd5e1; }
        .divider-line::before, .divider-line::after { content: ''; flex: 1; height: 1px; background: #f1f5f9; }
        .back-link { display: flex; align-items: center; gap: 10px; background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 11px 15px; color: #64748b; text-decoration: none; font-size: 0.83rem; font-weight: 600; transition: all 0.25s ease; }
        .back-link:hover { background: #eff6ff; border-color: #bfdbfe; color: #2563eb; }
        .back-link i:last-child { margin-left: auto; font-size: 0.72rem; color: #cbd5e1; }
        .card-footer-note { text-align: center; margin-top: 1.5rem; font-size: 0.7rem; color: #94a3b8; font-weight: 500; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="bg-layer">
        <div class="bg-main"></div>
        <div class="bg-mesh"></div>
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="page-wrapper">
        <div class="login-card">
            <div class="card-header-strip"></div>
            <div class="card-body">
                <div class="admin-badge">
                    <div class="badge-dot"></div>
                    IT Departemen &mdash; Akses Terbatas
                </div>

                <div class="logo-area">
                    <div class="logo-box">
                        <img src="../../assets/img/logo_rkz.png" alt="Logo RKZ">
                    </div>
                    <div class="logo-text-wrap">
                        <h2>Admin Portal</h2>
                        <p>Pengelolaan Hak Akses Surat Pesanan</p>
                    </div>
                </div>

                <form id="formLoginAdmin">
                    <div class="form-group">
                        <label class="form-label">Username / NIP Karyawan</label>
                        <div class="input-wrap">
                            <input type="text" name="username" class="form-input"
                                placeholder="Masukkan Username Admin..." autocomplete="off" required autofocus>
                            <i class="bi bi-person-badge input-icon"></i>
                        </div>
                    </div>

                    <div class="form-group" style="margin-bottom:0;">
                        <label class="form-label">Kata Sandi</label>
                        <div class="input-wrap">
                            <input type="password" name="password" class="form-input"
                                placeholder="••••••••" required>
                            <i class="bi bi-lock-fill input-icon"></i>
                        </div>
                    </div>

                    <button type="submit" id="btnAdminLogin" class="btn-login">
                        <span class="btn-inner" id="adminBtnText">
                            <i class="bi bi-shield-check"></i> MASUK KE PANEL ADMIN
                        </span>
                    </button>
                </form>

                <div class="divider-line">Navigasi</div>

                <a href="../../index.html" class="back-link">
                    <i class="bi bi-arrow-left-circle" style="color:#2563eb;"></i>
                    Kembali ke Portal Utama
                    <i class="bi bi-chevron-right"></i>
                </a>

                <p class="card-footer-note">&copy; 2026 IT DEPT &mdash; RS RKZ Surabaya</p>
            </div>
        </div>
    </div>

    <script>
    $(document).ready(function() {
        $('#formLoginAdmin').on('submit', function(e) {
            e.preventDefault();
            var btn = $('#btnAdminLogin');
            btn.prop('disabled', true);
            $('#adminBtnText').html('<span class="spinner"></span>');

            $.ajax({
                url: 'aksi_masuk.php',
                type: 'POST',
                data: $(this).serialize(),
                dataType: 'json',
                success: function(response) {
                    if (response[0] === 'berhak') {
                        Swal.fire({
                            icon: 'success', title: 'Akses Diberikan',
                            text: 'Membuka panel administrasi...',
                            timer: 1200, showConfirmButton: false
                        }).then(function() { window.location.href = 'home.php'; });
                    } else {
                        Swal.fire({ icon: 'error', title: 'Akses Ditolak', text: response[0], confirmButtonColor: '#1d4ed8' });
                        resetBtn();
                    }
                },
                error: function() {
                    Swal.fire({ icon: 'error', title: 'Server Error', text: 'Gagal terhubung ke layanan.', confirmButtonColor: '#1d4ed8' });
                    resetBtn();
                }
            });
        });

        function resetBtn() {
            $('#btnAdminLogin').prop('disabled', false);
            $('#adminBtnText').html('<i class="bi bi-shield-check"></i> MASUK KE PANEL ADMIN');
        }
    });
    </script>
</body>
</html>
